# Цены Claude API в долларах за 1 миллион токенов. Меняй здесь, если цены изменятся:
# https://platform.claude.com/docs/en/about-claude/pricing
# cache_write — запись в кэш (5 минут, 1.25× от input), cache_read — чтение из кэша (0.1× от input).
models:
  claude-opus-5:     {input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50}
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
  claude-sonnet-5:   {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}
  claude-opus-4-8:   {input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50}
  claude-haiku-4-5:  {input: 1.00, output: 5.00,  cache_write: 1.25, cache_read: 0.10}

# Курс для показа цены в рублях
usd_rub: 90

# Оценка ответа модели до запроса (токенов): на каждый кусок + запас на размышления модели
estimate:
  output_per_beat: 70
  output_fixed: 2500
  chars_per_token: 2.6      # для русского текста токенов больше, берём с запасом
