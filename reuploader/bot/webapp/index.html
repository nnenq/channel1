<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Перезалив Shorts</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f0f2f5);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #fff));
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2481cc);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --sep: color-mix(in srgb, var(--hint) 22%, transparent);
    --ok: #2fa84f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 40px; }
  h1 { font-size: 22px; margin: 6px 4px 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint);
    font-weight: 600; margin: 18px 16px 6px; }
  .card { background: var(--card); border-radius: 12px; padding: 4px 0; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 16px; min-height: 44px; }
  .row + .row { border-top: 1px solid var(--sep); }
  .row .grow { flex: 1; min-width: 0; }
  .sub { color: var(--hint); font-size: 13px; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tap { cursor: pointer; }
  .tap:active { background: var(--sep); }
  .chev::after { content: "›"; color: var(--hint); font-size: 22px; line-height: 1; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    background: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.ghost { background: transparent; color: var(--link); padding: 6px 8px; font-weight: 500; }
  button.danger { background: transparent; color: var(--danger); }
  button.wide { width: 100%; }
  button:disabled { opacity: .5; }
  .x { background: transparent; color: var(--hint); font-size: 20px; padding: 0 6px; line-height: 1; }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--sep);
    border-radius: 9px; padding: 9px 10px; min-width: 0; }
  input.hhmm { width: 74px; text-align: center; font-variant-numeric: tabular-nums; }
  input.num { width: 74px; text-align: center; }
  .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 2px; gap: 2px; flex: 1; }
  .seg button { flex: 1; background: transparent; color: var(--text); font-weight: 500; padding: 7px 4px;
    border-radius: 7px; font-size: 14px; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--sep); color: var(--hint);
    white-space: nowrap; }
  .badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .badge.warn { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--sep); border-radius: 99px; transition: .2s; }
  .switch span::before { content: ""; position: absolute; width: 26px; height: 26px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 2px; background: var(--bg); border-radius: 99px;
    padding: 4px 4px 4px 12px; }
  .empty { text-align: center; color: var(--hint); padding: 28px 16px; }
  .hint { color: var(--hint); font-size: 13px; padding: 6px 16px 0; }
  .status { width: 22px; text-align: center; flex: none; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(0,0,0,.82);
    color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: 90vw; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--sep);
    border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite; vertical-align: -3px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .vid .views { font-variant-numeric: tabular-nums; color: var(--hint); font-size: 13px; white-space: nowrap; }
  a { color: var(--link); text-decoration: none; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--card);
    box-shadow: 0 -2px 12px rgba(0,0,0,.15); font-size: 14px; }
  .savebar[hidden] { display: none; }
  body.dirty { padding-bottom: 72px; }
  body.dirty .toast { bottom: 84px; }
  button.bin { background: transparent; color: var(--danger); padding: 4px 6px; font-size: 16px; flex: none; }
  button:disabled { opacity: .45; }
</style>
</head>
<body>
<main id="root"><div class="empty"><span class="spin"></span></div></main>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const $root = document.getElementById("root");
const STATUS = { planned: "🕒", running: "⏳", done: "✅", failed: "❌", skipped: "⏭" };
const SORT_BY = [["trend", "🔥 В тренде"], ["views", "Всего просмотров"], ["per_day", "В среднем/день"]];
const DELIVERY = [["youtube", "На YouTube"], ["telegram", "Мне в Telegram"], ["both", "Оба"]];
const PRIVACY = [["scheduled", "Запланировать"], ["public", "Сразу"], ["unlisted", "По ссылке"], ["private", "Приватное"]];
let state = {};
// Несохранённые настройки проекта: копятся здесь и отправляются одной кнопкой «Сохранить»
let draft = {}, draftPid = null;
const isDirty = () => Object.keys(draft).length > 0;
// что показывать целиком: списки «План» и «История» свёрнуты до 3 строк
const showAll = { slots: false, uploads: false };
const FOLD = 3;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtViews = n => n == null ? "" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(".0", "") + "M"
  : n >= 1e3 ? (n / 1e3).toFixed(1).replace(".0", "") + "K" : String(n);
const HHMM = 'class="hhmm" inputmode="numeric" maxlength="5" placeholder="ЧЧ:ММ"';
// "9" -> "09:00", "930" -> "09:30", "19.5" -> "19:05"
const fixTime = v => {
  v = String(v).trim();
  const m = v.match(/^(\d{1,2})(\d{2})$/) || v.match(/^(\d{1,2})(?:[:.\s-](\d{1,2}))?$/);
  if (!m) return v;
  return String(+m[1]).padStart(2, "0") + ":" + String(+(m[2] || 0)).padStart(2, "0");
};
const fmtDate = iso => new Date(iso).toLocaleString("ru-RU", { timeZone: state.tz || undefined,
  day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }).replace(",", "");
const fmtDur = s => s ? Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0") : "";
function fmtAgo(iso) {
  const d = (Date.now() - Date.parse(iso)) / 864e5;
  if (d < 1 / 24) return "только что";
  if (d < 1) return Math.floor(d * 24) + " ч назад";
  if (d < 60) return Math.floor(d) + " дн. назад";
  if (d < 730) return Math.floor(d / 30) + " мес. назад";
  return Math.floor(d / 365) + " г. назад";
}
const haptic = t => tg?.HapticFeedback?.notificationOccurred?.(t);

function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}
function alertMsg(msg) { tg?.showAlert ? tg.showAlert(msg) : alert(msg); }
function confirmMsg(msg) {
  return new Promise(r => tg?.showConfirm ? tg.showConfirm(msg, r) : r(confirm(msg)));
}
function openLink(url) { tg?.openLink ? tg.openLink(url) : window.open(url, "_blank"); }

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "Content-Type": "application/json", "X-Init-Data": tg?.initData || "" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { haptic("error"); throw new Error(data.error || "Ошибка " + res.status); }
  return data;
}
async function guarded(fn) {
  try { return await fn(); } catch (e) { alertMsg(e.message); }
}

// ---------- роутинг ----------
async function route() {
  clearTimeout(cutPoll);
  if (isDirty() && location.hash !== "#p" + draftPid) {
    if (!await confirmMsg("Есть несохранённые настройки. Выйти без сохранения?")) {
      location.hash = "#p" + draftPid; return;
    }
    draft = {}; updateSaveUI();
  }
  const m = location.hash.match(/^#p(\d+)/), c = location.hash.match(/^#cut(\d*)/);
  if (m) { tg?.BackButton.show(); showProject(+m[1]); }
  else if (c) { tg?.BackButton.show(); showCut(c[1] ? +c[1] : null); }
  else { tg?.BackButton.hide(); showHome(); }
}
tg?.BackButton.onClick(() => { location.hash = ""; });
window.addEventListener("hashchange", route);

// ---------- главная ----------
async function showHome() {
  const data = await guarded(() => api("GET", "/api/projects"));
  if (!data) { $root.innerHTML = `<div class="empty">Открой панель из Telegram-бота.</div>`; return; }
  const cards = data.projects.map(p => {
    let badge = !p.ready ? `<span class="badge warn">нет канала</span>`
      : !p.enabled ? `<span class="badge">пауза</span>`
      : p.exhausted ? `<span class="badge warn">видео кончились</span>`
      : `<span class="badge ok">${p.today_done}/${p.today_total} сегодня</span>`;
    return `<div class="row tap chev" onclick="location.hash='#p${p.id}'">
      <div class="grow"><div class="ellipsis"><b>${esc(p.name)}</b></div>
        <div class="sub ellipsis">${p.sources} ист. → ${esc(p.channel_title || "канал не привязан")}
        ${p.next ? " · следующий в " + p.next : ""}</div></div>${badge}</div>`;
  }).join("");
  $root.innerHTML = `
    <h1>Перезалив Shorts</h1>
    <div class="card">${cards || `<div class="empty">Пока нет проектов.<br>Проект = твои каналы-источники → 1 канал для перезалива.</div>`}</div>
    <div class="card" style="margin-top:12px"><div class="row tap chev" onclick="location.hash='#cut'">
      <div class="grow"><b>✂️ Умная обрезка</b><div class="sub">Укоротить видео до нужной длины незаметно для зрителя</div></div></div></div>
    <h2>Новый проект</h2>
    <div class="card"><div class="row">
      <input id="newName" class="grow" placeholder="Название, напр. HappyFlick 2">
      <button onclick="createProject()">Создать</button></div></div>
    <div class="hint">Время: ${esc(data.tz)}, сейчас ${data.now}</div>
    ${data.is_owner ? `<h2>💳 Баланс Claude API</h2><div class="card" id="balance"><div class="row"><span class="spin"></span></div></div>` : ""}
    ${data.is_owner ? `<h2>Доступ к боту</h2><div class="card" id="access"><div class="row"><span class="spin"></span></div></div>
    <div class="hint">Кроме тебя ботом пользуются только те, кому ты дал доступ: они видят все проекты и получают уведомления. Незнакомцы могут лишь отправить тебе запрос.</div>` : ""}`;
  if (data.is_owner) { loadAccess(); loadBalance(); }
}

async function loadBalance(d) {
  d = d || await api("GET", "/api/balance").catch(() => null);
  const box = document.getElementById("balance");
  if (!d || !box) return;
  const when = new Date(d.updated_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  box.innerHTML = `<div class="row"><div class="grow">${d.remaining == null
      ? `<span class="sub">Внеси пополнение — тогда посчитаю остаток.</span>`
      : `Остаток ≈ <b style="color:${d.remaining < d.threshold ? "var(--danger)" : "inherit"}">$${d.remaining.toFixed(2)}</b>
         <div class="sub">пополнено $${d.topped.toFixed(2)} − потрачено $${d.spent.toFixed(2)} · ${esc(d.source)}, ${when}</div>`}</div></div>
    ${d.topups.map(t => `<div class="row"><div class="grow">+$${t.amount.toFixed(2)} <span class="sub">${t.date}${t.note ? " · " + esc(t.note) : ""}</span></div>
      <button class="x" onclick="delTopup(${t.id})">×</button></div>`).join("")}
    <div class="row"><input id="tuAmount" class="num" placeholder="$" style="width:80px">
      <input id="tuDate" type="date" value="${new Date().toISOString().slice(0, 10)}" class="grow">
      <button onclick="addTopup()">Пополнил</button></div>
    <div class="hint" style="padding-bottom:10px">Примерно: точная сумма — console.anthropic.com → Billing.
      ${d.admin_key ? "Расходы берутся из Anthropic Console раз в час." : "Расходы считает бот по своим запросам."}
      ${d.ai_enabled ? "" : " AI-режим выключен: в .env нет ANTHROPIC_API_KEY."}</div>`;
}
async function addTopup() {
  const d = await guarded(() => api("POST", "/api/balance/topup", {
    amount: document.getElementById("tuAmount").value, date: document.getElementById("tuDate").value }));
  if (d) { haptic("success"); loadBalance(d); }
}
async function delTopup(id) {
  if (!await confirmMsg("Удалить это пополнение?")) return;
  const d = await guarded(() => api("DELETE", `/api/balance/topup/${id}`));
  if (d) loadBalance(d);
}

const ACCESS_BADGE = { pending: ["warn", "ждёт"], allowed: ["ok", "есть доступ"], blocked: ["", "заблокирован"] };
async function loadAccess(d) {
  d = d || await guarded(() => api("GET", "/api/access"));
  const box = document.getElementById("access");
  if (!d || !box) return;
  const btn = (uid, action, text, cls = "ghost") =>
    `<button class="${cls}" onclick="accessChange(${uid}, '${action}')">${text}</button>`;
  box.innerHTML = d.users.map(u => {
    const [cls, label] = ACCESS_BADGE[u.status] || ["", u.status];
    const actions = u.status === "pending" ? btn(u.id, "allow", "Дать") + btn(u.id, "block", "Отклонить", "danger")
      : u.status === "allowed" ? btn(u.id, "remove", "Забрать", "danger")
      : btn(u.id, "allow", "Дать") + btn(u.id, "remove", "Удалить", "danger");
    return `<div class="row"><div class="grow" style="min-width:0">
        <div class="ellipsis">${esc(u.name || "без имени")}${u.username ? ` <span class="sub">@${esc(u.username)}</span>` : ""}</div>
        <div class="sub">id ${u.id} · <span class="badge ${cls}">${label}</span></div></div>${actions}</div>`;
  }).join("") + `<div class="row"><button class="ghost" onclick="makeInvite()">🔗 Создать ссылку-приглашение</button></div>
    <div id="invite"></div>`;
}
async function accessChange(uid, action) {
  if (action !== "allow" && !await confirmMsg(action === "remove" ? "Забрать доступ?" : "Отклонить и заблокировать?")) return;
  const d = await guarded(() => api("POST", `/api/access/${uid}`, { action }));
  if (d) { haptic("success"); loadAccess(d); }
}
async function makeInvite() {
  const d = await guarded(() => api("POST", "/api/access/invite"));
  if (!d) return;
  document.getElementById("invite").innerHTML = `<div class="row"><input class="grow" readonly value="${esc(d.link)}" onclick="this.select()">
      <button onclick="navigator.clipboard?.writeText('${esc(d.link)}').then(() => toast('Скопировано'))">Копировать</button></div>
    <div class="row"><button class="ghost" onclick="tg?.openTelegramLink ? tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent('${esc(d.link)}')) : openLink('${esc(d.link)}')">📤 Отправить в Telegram</button></div>
    <div class="hint" style="padding-bottom:10px">Одноразовая, действует 24 часа: кто первым откроет — получит доступ.</div>`;
}
async function createProject() {
  const name = document.getElementById("newName").value;
  const r = await guarded(() => api("POST", "/api/projects", { name }));
  if (r) { haptic("success"); location.hash = "#p" + r.id; }
}

// ---------- проект ----------
async function showProject(id, data) {
  data = data || await guarded(() => api("GET", `/api/projects/${id}`));
  if (!data) return;
  if (draftPid !== id) { draft = {}; draftPid = id; showAll.slots = showAll.uploads = false; }
  state = data;
  const P = data.project;                 // как сохранено на сервере
  const p = { ...P, ...draft };           // как сейчас на экране (с несохранёнными правками)
  const e = p.effects;
  const drafted = (k, saved) => k in draft ? esc(draft[k]) : saved;
  $root.innerHTML = `
    <div class="card"><div class="row">
      <input class="grow" id="name" value="${esc(p.name)}" oninput="stage({name:this.value}, false)" style="font-weight:600;font-size:17px">
      <label class="switch" title="Включён"><input type="checkbox" ${p.enabled ? "checked" : ""}
        onchange="stage({enabled:this.checked})"><span></span></label></div>
      <div class="hint" style="padding-bottom:10px">${p.enabled ? "Работает по расписанию" : "На паузе — автоматически не заливает"}
        · всего перезалито: ${data.total_uploaded}</div></div>

    <h2>Куда отправлять готовые видео</h2>
    <div class="card">
      <div class="row"><div class="seg">${DELIVERY.map(([k, v]) =>
        `<button class="${p.delivery === k ? "on" : ""}" onclick="stage({delivery:'${k}'})">${v}</button>`).join("")}</div></div>
    </div>
    <div class="hint">${{
      youtube: "Бот сам публикует обработанное видео на твой канал.",
      telegram: "Бот присылает тебе в этот чат уже обработанное видео и текст (название, описание, теги) — выкладываешь сам. Привязка канала не нужна.",
      both: "Бот публикует на канал и заодно присылает копию видео тебе в Telegram.",
    }[p.delivery]}</div>

    ${p.delivery === "telegram" ? "" : `<h2>Канал для перезалива</h2>
    <div class="card">
      ${p.linked ? `<div class="row"><div class="grow"><b>${esc(p.channel_title)}</b>
          <div class="sub"><a href="#" onclick="openLink('https://youtube.com/channel/${esc(p.channel_id)}');return false">открыть канал</a></div></div>
          <button class="ghost" onclick="${data.device_login ? "linkByCode()" : "linkChannel()"}">Сменить</button></div>`
        : `<div class="row"><div class="grow">Канал не привязан</div><button onclick="${data.device_login ? "linkByCode()" : "linkChannel()"}">Привязать канал</button></div>`}
      <div id="linkBox">${data.linking ? codeBox(data.linking) : ""}</div>
    </div>
    <div class="hint">${data.device_login
      ? `Вход по коду работает с любого телефона или компьютера. <a href="#" onclick="linkChannel();return false">Войти в браузере на компьютере с ботом</a>.`
      : "Вход в Google открывается в браузере — делай это <b>на компьютере, где запущен бот</b> (в Telegram Desktop)."} Выбери именно канал для перезалива.</div>`}

    <h2>Откуда брать — твои каналы (YouTube / TikTok)</h2>
    <div class="card">
      ${data.sources.map(s => `<div class="row"><div class="grow ellipsis">
          <a href="#" onclick="openLink('${esc(s.url)}${s.url.includes('tiktok.com') ? '' : '/shorts'}');return false">${esc(s.label)}</a></div>
          <button class="x" onclick="delSource(${s.id})">×</button></div>`).join("")}
      <div class="row"><input id="srcUrl" class="grow" placeholder="YouTube или TikTok: https://…/@канал">
        <button onclick="addSource()">Добавить</button></div>
      <div class="row"><div class="grow">Не повторять ролики с других моих каналов
          <div class="sub">если ролик уже залит в другой твой проект — сюда его не брать</div></div>
        <label class="switch"><input type="checkbox" ${p.no_cross_dupes ? "checked" : ""}
          onchange="stage({no_cross_dupes:this.checked})"><span></span></label></div>
      <div class="row"><div class="seg">
        <button class="${p.strategy === "rotate" ? "on" : ""}" onclick="stage({strategy:'rotate'})">Каналы по очереди</button>
        <button class="${p.strategy === "top" ? "on" : ""}" onclick="stage({strategy:'top'})">Общий топ</button></div></div>
    </div>
    <div class="hint">Можно вставить несколько ссылок через пробел. Если TikTok-аккаунт не читается — вставь ссылку на любое его видео.</div>

    <h2>Какие видео брать</h2>
    <div class="card">
      <div class="row" style="flex-wrap:wrap"><div class="grow" style="min-width:100%">Тема — про что ролики
        <div class="sub">пиши как удобно: «Эльза», «холодное сердце», «Рик и Морти». Несколько — через запятую. Пусто — любые</div></div>
        <input id="topicIn" class="grow" placeholder="например: Эльза" value="${drafted("topic", esc(P.topic || ""))}"
          oninput="stage({topic:this.value}, false)">

const pid = () => state.project.id;
async function reload(data) { await showProject(pid(), data); }
const cur = () => ({ ...state.project, ...draft });
// Правка настройки: только запоминаем. rerender=false — для полей ввода (не сбивать фокус/клавиатуру)
function stage(body, rerender = true) {
  Object.assign(draft, body);
  if (rerender) showProject(pid(), state); else updateSaveUI();
}
function stageFx(extra, rerender = false) {
  const v = id => +document.getElementById(id).value;
  stage({ effects: { ...cur().effects, zoom: 1 + v("fx_zoom") / 100, rotate_deg: v("fx_rot"), shadows: v("fx_sh") / 100,
    edge_blur: { height: v("fx_bh") / 100, sigma: v("fx_bs") }, ...(extra || {}) } }, rerender);
}
const fxOn = (e, k, dflt) => e[k] ?? dflt;
function updateSaveUI() {
  const dirty = isDirty() && location.hash === "#p" + draftPid;
  document.body.classList.toggle("dirty", dirty);
  let bar = document.getElementById("saveBar");
  if (!bar) {
    bar = document.createElement("div"); bar.id = "saveBar"; bar.className = "savebar";
    bar.innerHTML = `<div class="grow">Есть несохранённые изменения</div>
      <button class="ghost" onmousedown="event.preventDefault()" onclick="discardDraft()">Отменить</button><button onmousedown="event.preventDefault()" onclick="saveAll()">💾 Сохранить</button>`;
    document.body.appendChild(bar);
  }
  bar.hidden = !dirty;
  const btn = document.getElementById("saveAllBtn"), hint = document.getElementById("saveHint");
  if (btn) btn.disabled = !dirty;
  if (hint) hint.textContent = dirty ? "Изменения применятся только после сохранения." : "Все настройки сохранены.";
  if (dirty) tg?.enableClosingConfirmation?.(); else tg?.disableClosingConfirmation?.();
}
function discardDraft() { draft = {}; showProject(pid(), state); }
async function saveAll() {
  if (!isDirty()) return toast("Нечего сохранять");
  const body = { ...draft };
  const d = await guarded(() => api("PATCH", `/api/projects/${pid()}`, body));
  if (!d) return;                       // ошибка показана, правки остаются — можно исправить
  draft = {}; haptic("success"); toast("Настройки сохранены"); reload(d);
}
// Свёртка длинных списков: видно FOLD строк, остальное — по «Показать все»
function foldStart(slots) {           // в «Плане» показываем ближайшие к «сейчас»
  const i = slots.findIndex(s => s.status === "planned" || s.status === "running");
  return i < 0 ? Math.max(0, slots.length - FOLD) : Math.max(0, Math.min(i - 1, slots.length - FOLD));
}
function fold(list, key, start = 0) {
  return showAll[key] || list.length <= FOLD ? list : list.slice(start, start + FOLD);
}
function foldButton(list, key) {
  if (list.length <= FOLD) return "";
  return `<div class="row"><button class="ghost wide" onclick="showAll.${key}=!showAll.${key};showProject(pid(), state)">${
    showAll[key] ? "Свернуть" : `Показать все (${list.length})`}</button></div>`;
}
function choose(msg, buttons) {       // до 3 кнопок; -> id нажатой или null
  if (tg?.showPopup) return new Promise(r => tg.showPopup({ message: msg, buttons }, id => r(id || null)));
  const b = buttons.filter(x => x.type !== "cancel");
  for (const x of b) if (confirm(msg + "\n\n" + x.text + "?")) return Promise.resolve(x.id);
  return Promise.resolve(null);
}
async function delUpload(id, onYoutube) {
  const how = onYoutube
    ? await choose("Удалить этот ролик?", [
        { id: "yt", type: "destructive", text: "С YouTube и из истории" },
        { id: "hist", type: "default", text: "Только из истории" },
        { type: "cancel" }])
    : (await confirmMsg("Убрать ролик из истории?") ? "hist" : null);
  if (!how) return;
  const d = await guarded(() => api("DELETE", `/api/projects/${pid()}/uploads/${id}?youtube=${how === "yt" ? 1 : 0}`));
  if (d) { haptic("success"); toast(d.note || "Удалено"); reload(d); }
}
async function addSource() {
  const url = document.getElementById("srcUrl").value.trim();
  if (!url) return;
  const d = await guarded(() => api("POST", `/api/projects/${pid()}/sources`, { url }));
  if (d) { haptic("success"); reload(d); }
}
async function delSource(sid) {
  if (!await confirmMsg("Убрать канал из источников?")) return;
  const d = await guarded(() => api("DELETE", `/api/projects/${pid()}/sources/${sid}`));
  if (d) reload(d);
}
function addTime() {
  const t = fixTime(document.getElementById("newTime").value);
  if (t) stage({ fixed_times: [...new Set([...cur().fixed_times, t])].sort() });
}
function delTime(t) { stage({ fixed_times: cur().fixed_times.filter(x => x !== t) }); }
async function publishAuto() {
  if (!await confirmMsg("Залить один ролик прямо сейчас? Бот сам выберет видео по правилам проекта"
    + (isDirty() ? " (по сохранённым настройкам — несохранённые правки не учитываются)" : "") + ".")) return;
  const r = await guarded(() => api("POST", `/api/projects/${pid()}/publish`, { when: "auto" }));
  if (r) { haptic("success"); toast("Выбираю ролик и заливаю — пришлю в чат"); reload(); }
}
async function replan() {
  const d = await guarded(() => api("POST", `/api/projects/${pid()}/replan`));
  if (d) { haptic("success"); toast("Время перераспределено"); reload(d); }
}
async function cancelSlot(sid) {
  const d = await guarded(() => api("DELETE", `/api/projects/${pid()}/slots/${sid}`));
  if (d) reload(d);
}
function codeBox(d) {
  return `<div class="row" style="flex-direction:column;align-items:stretch;gap:8px;text-align:center">
      <div class="sub">Открой ссылку, войди в Google, выбери канал и введи код:</div>
      <div style="font-size:28px;font-weight:700;letter-spacing:3px;font-variant-numeric:tabular-nums"
        onclick="navigator.clipboard?.writeText('${esc(d.code)}').then(() => toast('Код скопирован'))">${esc(d.code)}</div>
      <button onclick="openLink('${esc(d.url)}')">Открыть ${esc(d.url.replace(/^https?:\/\//, ""))}</button>
      <div class="sub"><span class="spin"></span> жду, пока введёшь код…</div></div>`;
}
let linkPoll = null;
async function linkByCode() {
  const d = await guarded(() => api("POST", `/api/projects/${pid()}/auth-device`));
  if (!d) return;
  document.getElementById("linkBox").innerHTML = codeBox(d);
  const id = pid(), was = state.project.channel_id;
  clearInterval(linkPoll);
  linkPoll = setInterval(async () => {
    if (location.hash !== "#p" + id) return clearInterval(linkPoll);
    const r = await api("GET", `/api/projects/${id}`).catch(() => null);
    if (r && (r.project.channel_id !== was && r.project.linked || !r.linking)) {
      clearInterval(linkPoll);
      if (r.project.channel_id !== was) { haptic("success"); toast("Канал привязан: " + r.project.channel_title); }
      showProject(id, r);
    }
  }, 4000);
}
async function linkChannel() {
  const d = await guarded(() => api("POST", `/api/projects/${pid()}/auth`));
  if (d) { openLink(d.url); toast("После входа вернись сюда и потяни вниз для обновления"); }
}
async function delProject() {
  if (!await confirmMsg(`Удалить проект «${state.project.name}»? История заливок тоже удалится.`)) return;
  if (await guarded(() => api("DELETE", `/api/projects/${pid()}`))) location.hash = "";
}

let topSort = null;
async function loadTopics() {
  const box = document.getElementById("topicsBox");
  box.innerHTML = `<div class="row"><span class="spin"></span><span class="sub">Смотрю, про что ролики на твоих каналах…</span></div>`;
  const d = await guarded(() => api("GET", `/api/projects/${pid()}/topics`));
  if (!d) { box.innerHTML = ""; return; }
  box.innerHTML = d.topics.length
    ? `<div class="row"><div class="chips grow">${d.topics.map(t => `<span class="chip tap" style="padding-right:12px"
        onclick="pickTopic('${esc(t.name)}')">${esc(t.name)} · ${t.count}</span>`).join("")}</div></div>
       <div class="row sub">Из ${d.total} роликов. Нажми тему — или впиши свою.</div>`
    : `<div class="row sub">Известных тем не нашёл (из ${d.total} роликов) — впиши тему сам, например название мультфильма на английском.</div>`;
}
function pickTopic(name) {
  document.getElementById("topicIn").value = name;
  stage({ topic: name }, false);
  haptic("success"); toast("Тема: " + name + " — не забудь сохранить");
}
async function loadTop(refresh) {
  const box = document.getElementById("top");
  box.innerHTML = `<div class="row"><span class="spin"></span><span class="sub">Смотрю каналы… (до минуты)</span></div>`;
  const q = new URLSearchParams({ topic: cur().topic || "" });
  if (refresh) q.set("refresh", "1");
  const d = await guarded(() => api("GET", `/api/projects/${pid()}/top?${q}`));
  if (!d) { box.innerHTML = ""; return; }
  window._topData = d;
  topSort = topSort || state.project.sort_by || "trend";
  renderTop();
}
const TOP_SORTS = {
  trend: [ "🔥 Тренд", null ],
  views: [ "Просмотры", v => v.view_count || 0 ],
  per_day: [ "В день", v => v.views_per_day ?? -1 ],
  new: [ "Новые", v => v.published ? Date.parse(v.published) : 0 ],
};
function renderTop() {
  const d = window._topData, box = document.getElementById("top");
  const key = TOP_SORTS[topSort][1];
  window._top = {};
  box.innerHTML = `<div class="row"><div class="seg">${Object.entries(TOP_SORTS).map(([k, [label]]) =>
      `<button class="${topSort === k ? "on" : ""}" onclick="topSort='${k}';renderTop()">${label}</button>`).join("")}</div></div>`
    + (d.topic ? `<div class="row sub">Только про «${esc(d.topic)}» · найдено ${d.sources.reduce((n, s) => n + s.videos.length, 0)}</div>` : "")
    + (d.with_api ? "" : `<div class="hint" style="padding-bottom:6px">Даты есть только у первых 30 роликов — привяжи канал, чтобы видеть все.</div>`)
    + d.sources.map(s => `
    <div class="row"><b class="grow">${esc(s.label)}</b></div>
    ${s.error ? `<div class="row sub">Ошибка: ${esc(s.error)}</div>` : ""}
    ${!s.error && !s.videos.length && d.topic ? `<div class="row sub">Про «${esc(d.topic)}» здесь роликов нет</div>` : ""}
    ${(key ? [...s.videos].sort((a, b) => key(b) - key(a)) : s.videos).slice(0, 15).map(v => { window._top[v.id] = v; return `
      <div class="row tap vid" onclick="publishPrompt('${v.url}', '${v.id}')">
        <div class="grow" style="min-width:0"><div class="ellipsis">${esc(v.title)}</div>
          <div class="sub">${[
            v.published ? "📅 " + fmtDate(v.published) + " · " + fmtAgo(v.published) : "",
            v.duration ? "⏱ " + fmtDur(v.duration) : "",
            v.trend_per_day != null ? (v.hot ? "🔥 " : "") + "+" + fmtViews(v.trend_per_day) + " за сутки" : "",
            v.views_per_day != null ? "≈" + fmtViews(v.views_per_day) + "/день в ср." : "",
          ].filter(Boolean).join(" · ")}</div></div>
        ${v.uploaded ? `<span class="badge ok">залито</span>` : ""}
        <span class="views">👁 ${fmtViews(v.view_count)}</span></div>`; }).join("")}`).join("")
    + `<div class="row"><button class="ghost" onclick="loadTop(true)">↻ Обновить</button></div>`;
}

function publishPrompt(url, vid) {
  return openCoverEditor(url, vid);
}
// ---------- умная обрезка ----------
let cutPoll = null, cutMeta = null;
const CUT_STATUS = { uploading: "загрузка", uploaded: "загружено — выбери длину", queued: "в очереди",
  confirm: "жду подтверждения AI-анализа",
  running: "обрабатываю", done: "готово", failed: "ошибка" };
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + " МБ" : Math.round(b / 1024) + " КБ";
const progressBar = f => `<div style="height:8px;background:var(--sep);border-radius:4px;overflow:hidden">
  <div style="height:100%;width:${Math.round(f * 100)}%;background:var(--accent);transition:width .3s"></div></div>`;

async function showCut(jid) {
  const d = await guarded(() => api("GET", "/api/cut"));
  if (!d) return;
  cutMeta = d;
  const job = jid ? (d.jobs.find(j => j.id === jid) || await guarded(() => api("GET", `/api/cut/${jid}`))) : null;
  $root.innerHTML = `
    <h1>✂️ Умная обрезка</h1>
    <div class="hint" style="padding:0 4px 8px">Режу только в паузах речи, сохраняю хук в начале и развязку,
      убираю «воду». Без новой озвучки и переходов. До ${d.max_mb} МБ и ${d.max_minutes} мин.</div>
    <div id="cutJob">${job ? "" : `<div class="card"><div class="row">
      <input type="file" id="cutFile" accept="video/*" class="grow"></div>
      <div class="row"><button class="wide" onclick="startUpload()">Загрузить</button></div></div>`}</div>
    ${d.jobs.length ? `<h2>Недавние</h2><div class="card">${d.jobs.map(j => `
      <div class="row tap" onclick="location.hash='#cut${j.id}'"><div class="grow" style="min-width:0">
        <div class="ellipsis">${esc(j.filename)}</div><div class="sub">${CUT_STATUS[j.status] || j.status}${j.target ? " · цель " + j.target + " с" : ""}</div></div>
        <span class="sub">›</span></div>`).join("")}</div>` : ""}`;
  if (job) renderJob(job);
}

async function startUpload() {
  const f = document.getElementById("cutFile").files[0];
  if (!f) return alertMsg("Выбери видео.");
  if (f.size > cutMeta.max_mb * 1048576) return alertMsg(`Файл больше ${cutMeta.max_mb} МБ.`);
  const job = await guarded(() => api("POST", "/api/cut", { filename: f.name, size: f.size }));
  if (!job) return;
  history.replaceState(null, "", "#cut" + job.id);
  await uploadChunks(job.id, f, 0, job.chunk);
}

async function uploadChunks(jid, file, offset, chunk) {
  const box = document.getElementById("cutJob");
  let retries = 0;
  while (offset < file.size) {
    box.innerHTML = `<div class="card"><div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
      <div>Загрузка «${esc(file.name)}»: ${fmtSize(offset)} из ${fmtSize(file.size)}</div>${progressBar(offset / file.size)}
      <div class="sub">Не закрывай панель до конца загрузки.</div></div></div>`;
    try {
      const res = await fetch(`/api/cut/${jid}/chunk?offset=${offset}`, { method: "PUT",
        headers: { "X-Init-Data": tg?.initData || "" }, body: file.slice(offset, offset + chunk) });
      const data = await res.json().catch(() => ({}));
      if (res.status === 409) { offset = data.uploaded; continue; }     // сервер уже имеет больше — продолжаем оттуда
      if (!res.ok) throw new Error(data.error || "Ошибка " + res.status);
      offset = Math.min(file.size, offset + chunk);
      retries = 0;
      if (data.status && data.status !== "uploading") return renderJob(data);
    } catch (e) {
      if (++retries > 5 || /видео|длиннее|больше/.test(e.message)) return alertMsg(e.message);
      await new Promise(r => setTimeout(r, 2000 * retries));             // обрыв связи — повторяем
      const st = await api("GET", `/api/cut/${jid}`).catch(() => null);
      if (st) offset = st.uploaded;
    }
  }
  const st = await guarded(() => api("GET", `/api/cut/${jid}`));
  if (st) renderJob(st);
}

function renderJob(j) {
  const box = document.getElementById("cutJob");
  if (!box) return;
  clearTimeout(cutPoll);
  let html = `<div class="card"><div class="row"><div class="grow" style="min-width:0"><b class="ellipsis">${esc(j.filename)}</b>
    <div class="sub">${CUT_STATUS[j.status] || j.status}${j.stage && j.status !== "done" ? " · " + esc(j.stage) : ""}</div></div></div>`;
  if (["queued", "running"].includes(j.status) || (j.status === "confirm" && !j.estimate)) {
    html += `<div class="row" style="flex-direction:column;align-items:stretch;gap:6px">${progressBar(j.progress || 0)}
      <div class="sub">${Math.round((j.progress || 0) * 100)}% · результат пришлю и в чат</div></div>`;
    cutPoll = setTimeout(async () => { const r = await api("GET", `/api/cut/${j.id}`).catch(() => null); if (r) renderJob(r); }, 2000);
  }
  if (j.status === "failed") html += `<div class="row sub" style="color:var(--danger)">${esc(j.error || "ошибка")}</div>`;
  if (["uploaded", "failed", "done"].includes(j.status) && j.status !== "done" || (j.status === "done" && !j.report)) {
    html += `
      <div class="row"><div class="seg">
        <button id="tm_manual" class="on" onclick="cutMode('manual')">Вручную</button>
        <button id="tm_channel" onclick="cutMode('channel')">Как на канале</button>
        <button id="tm_list" onclick="cutMode('list')">Список</button></div></div>
      <div id="tmBox"></div>
      ${cutMeta?.ai_available ? `<div class="row"><label style="display:flex;gap:8px;align-items:center">
        <input type="checkbox" id="tmAi"> 🤖 AI-анализ Claude (платно — сначала покажу цену)</label></div>` : ""}
      <div class="row"><button class="wide" onclick="runCut(${j.id})">✂️ Обрезать</button></div>`;
  }
  if (j.status === "confirm" && j.estimate) {
    const e = j.estimate;
    html += `<div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
      <div>🤖 AI-анализ будет стоить примерно <b>$${e.usd.toFixed(3)}</b> (≈ ${Math.round(e.rub)} ₽)</div>
      <div class="sub">${e.input_tokens} + ${e.output_tokens} токенов, ${esc(e.model)}${e.remaining != null ? ` · на счёте ≈ $${e.remaining.toFixed(2)}` : ""}</div>
      ${e.affordable ? `<button onclick="decideAi(${j.id}, true)">✅ Да, продолжить</button>`
        : `<div class="sub" style="color:var(--danger)">Недостаточно средств на счёте Claude.</div>`}
      <button class="ghost" onclick="decideAi(${j.id}, false)">Нет, бесплатный режим</button></div>`;
  }
  if (j.status === "done" && j.report_text) {
    html += `<div class="row" style="white-space:pre-wrap;font-size:14px;line-height:1.45">${esc(j.report_text)}</div>`;
    if (j.link) html += `<div class="row"><button class="wide" onclick="openLink(location.origin + '${j.link}')">📥 Скачать результат</button></div>`;
    html += `<div class="row"><button class="ghost" onclick="location.hash='#cut'">Обрезать другое видео</button></div>`;
  }
  html += `</div>`;
  box.innerHTML = html;
  if (document.getElementById("tmBox")) cutMode("manual");
}

async function decideAi(jid, yes) {
  const r = await guarded(() => api("POST", `/api/cut/${jid}/ai`, { yes }));
  if (r) { haptic("success"); renderJob(r); }
}

let cutModeCur = "manual";
function cutMode(m) {
  cutModeCur = m;
  ["manual", "channel", "list"].forEach(k => document.getElementById("tm_" + k)?.classList.toggle("on", k === m));
  document.getElementById("tmBox").innerHTML = {
    manual: `<div class="row"><div class="grow">Длина<div class="sub">точно или диапазон</div></div><input id="tmSec" class="num" placeholder="0:58 / 1:35-2:35" style="width:140px"></div>`,
    channel: `<div class="row"><input id="tmUrl" class="grow" placeholder="https://www.youtube.com/@канал"></div>
      <div class="hint" style="padding-bottom:8px">Возьму медиану длины лучших 30% роликов канала по просмотрам.</div>`,
    list: `<div class="row"><textarea id="tmList" class="grow" rows="5" placeholder="0:45 1.2M&#10;0:30 800k&#10;1:05 50k"
      style="font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--sep);border-radius:9px;padding:8px"></textarea></div>
      <div class="hint" style="padding-bottom:8px">Строки «длительность просмотры» — возьму медиану лучших 30%.</div>`,
  }[m];
}

async function runCut(jid) {
  const body = { mode: cutModeCur };
  if (cutModeCur === "manual") body.seconds = document.getElementById("tmSec").value;
  if (cutModeCur === "channel") body.url = document.getElementById("tmUrl").value;
  if (cutModeCur === "list") body.text = document.getElementById("tmList").value;
  body.ai = !!document.getElementById("tmAi")?.checked;
  const r = await guarded(() => api("POST", `/api/cut/${jid}/run`, body));
  if (r) { haptic("success"); renderJob(r); }
}

route();
</script>
<script src="/assets/covers.js"></script>
</body>
</html>
